[package]
name = "lgo-video-shrinker"
version = "2.0.0"
description = "LGO Video Shrinker - Compresseur vidéo MP4 avec accélération matérielle et mise à jour automatique"
authors = ["LGO"]
edition = "2021"
rust-version = "1.85"
resolver = "3"

[lib]
name = "lgo_video_shrinker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
walkdir = "2"
trash = "5"
dunce = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
